spring:
  application:
    name: order-workflow-example
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:workflow}
    username: ${DB_USER:workflow}
    password: ${DB_PASSWORD:workflow}
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

workflow:
  orchestrator:
    jdbc:
      enabled: true
      schema-initialization: true
    kafka:
      enabled: true
      topic: workflow.status
      consumer-group: order-workflow-example
      replay-topic: workflow.replay
      replay-consumer-group: order-workflow-example-replay
      concurrency: 1
      missing-topics-fatal: false
    async:
      virtual-threads: true
      concurrency: 16
    retry:
      enabled: true
      max-attempts: 3
      delay: 1s
      steps:
        initiate-payment:
          max-attempts: 2
          delay: 2s
        notify-payment-success:
          max-attempts: 3
          delay: 1s
        notify-payment-failed:
          max-attempts: 3
          delay: 1s
        refund-payment:
          max-attempts: 1
          delay: 2s
    rest-client:
      connect-timeout: 3s
      response-timeout: 10s
      max-connections: 50
      pending-acquire-timeout: 5s
    circuit-breaker:
      enabled: true

server:
  port: 8080

demo:
  payment:
    base-url: ${DEMO_PAYMENT_BASE_URL:http://localhost:8089}
  notification:
    base-url: ${DEMO_NOTIFICATION_BASE_URL:http://localhost:8089}
  inventory:
    base-url: ${DEMO_INVENTORY_BASE_URL:http://localhost:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,metrics,prometheus
  endpoint:
    loggers:
      access: unrestricted
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/logs}

logging:
  level:
    reactor.netty.http.client: DEBUG
    org.springframework.web: DEBUG
    org.springframework.kafka: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.boot: DEBUG
    org.springframework: ERROR
    com.github.ghik.orcas: DEBUG