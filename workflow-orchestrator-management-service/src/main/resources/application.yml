spring:
  application:
    name: workflow-orchestrator-management-service
  kafka:
    template:
      observation-enabled: false
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
        linger.ms: 5
        batch.size: 16384
        buffer.memory: 8388608
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 10000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:workflow-management-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orchestrator}
    username: ${DB_USER:orchestrator}
    password: ${DB_PASSWORD:orchestrator}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: 1
      connection-timeout: 5000
workflow:
  orchestrator:
    observability:
      metrics-export: ${OTEL_METRICS_ENABLED:true}
      metrics-endpoint: ${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
    service:
      enabled: true
      base-path: /api/orchestrator
      default-page-size: 25
    dashboard:
      enabled: true
      base-path: /api/orchestrator/kafka
    jdbc:
      enabled: true
      schema-initialization: true
    kafka:
      enabled: true
      consumers-enabled: false
      topic: workflow.status
      replay-topic: workflow.replay
      consumer-group: workflow-management-service
      replay-consumer-group: workflow-management-service-replay
      missing-topics-fatal: false

server:
  port: 8081

management:
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 30s
        aggregation-temporality: delta
        resource-attributes:
          service.name: ${spring.application.name}
        enabled: ${OTEL_METRICS_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      probes:
        enabled: true

  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
