spring:
  application:
    name: workflow-orchestrator-management-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:workflow-management-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orchestrator}
    username: ${DB_USER:orchestrator}
    password: ${DB_PASSWORD:orchestrator}
workflow:
  orchestrator:
    service:
      enabled: true
      base-path: /api/orchestrator
      default-page-size: 25
    dashboard:
      enabled: true
      base-path: /api/orchestrator/kafka
    jdbc:
      enabled: true
      schema-initialization: true
    kafka:
      enabled: true
      topic: workflow.status
      replay-topic: workflow.replay
      consumer-group: workflow-management-service
      replay-consumer-group: workflow-management-service-replay
      missing-topics-fatal: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      probes:
        enabled: true
