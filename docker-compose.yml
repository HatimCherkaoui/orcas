name: workflow-orchestrator-060

services:
  postgres:
    image: postgres:18.6
    container_name: workflow-postgres
    profiles: [ dev, prod ]
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orchestrator -d orchestrator" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [ workflow-net ]

  kafka:
    cpu_shares: 2048
    image: apache/kafka:4.3.1
    container_name: workflow-kafka
    profiles: [ dev, prod ]
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms128m -Xmx256m}
      KAFKA_JVM_PERFORMANCE_OPTS: ${KAFKA_JVM_PERFORMANCE_OPTS:--server -XX:+UseG1GC -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError}
      KAFKA_NUM_NETWORK_THREADS: ${KAFKA_NETWORK_THREADS:-2}
      KAFKA_NUM_IO_THREADS: ${KAFKA_IO_THREADS:-4}
      KAFKA_BACKGROUND_THREADS: 2
      KAFKA_LOG_CLEANER_THREADS: 1
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 33554432
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_BROKER_SESSION_TIMEOUT_MS: ${KAFKA_BROKER_SESSION_TIMEOUT_MS:-30000}
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: ${KAFKA_CONTROLLER_REQUEST_TIMEOUT_MS:-10000}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./scripts/kafka-health.sh:/opt/orcas/kafka-health.sh:ro
    healthcheck:
      test: [ "CMD", "bash", "/opt/orcas/kafka-health.sh" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [ workflow-net ]

  workflow-management-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: management
      args:
        MAVEN_THREADS: ${MAVEN_THREADS:-2}
        BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-300}
    container_name: workflow-management-service
    profiles: [ dev, prod ]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: workflow-orchestrator-management-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator
      SPRING_DATASOURCE_USERNAME: orchestrator
      SPRING_DATASOURCE_PASSWORD: orchestrator
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: workflow-management-service
      WORKFLOW_ORCHESTRATOR_SERVICE_ENABLED: "true"
      WORKFLOW_ORCHESTRATOR_DASHBOARD_ENABLED: "true"
      WORKFLOW_ORCHESTRATOR_KAFKA_ENABLED: "true"
      WORKFLOW_ORCHESTRATOR_KAFKA_CONSUMERS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "${ORCAS_JAVA_TOOL_OPTIONS:--XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:MaxDirectMemorySize=64m -Xms64m -Xmx256m -XX:+ExitOnOutOfMemoryError}"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "8081:8081"
    networks: [ workflow-net ]

  example-app:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: example
      args:
        MAVEN_THREADS: ${MAVEN_THREADS:-2}
        BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-300}
    container_name: workflow-example-app
    profiles: [ dev, prod ]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: workflow-example-app
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator
      SPRING_DATASOURCE_USERNAME: orchestrator
      SPRING_DATASOURCE_PASSWORD: orchestrator
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: workflow-orchestrator
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      DEMO_PAYMENT_BASE_URL: http://wiremock:8080
      DEMO_NOTIFICATION_BASE_URL: http://wiremock:8080
      DEMO_INVENTORY_BASE_URL: http://wiremock:8080
      JAVA_TOOL_OPTIONS: "${ORCAS_JAVA_TOOL_OPTIONS:--XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:MaxDirectMemorySize=64m -Xms64m -Xmx256m -XX:+ExitOnOutOfMemoryError}"
      WORKFLOW_KAFKA_CONCURRENCY: ${WORKFLOW_KAFKA_CONCURRENCY:-2}
      WORKFLOW_KAFKA_PARTITIONS: ${WORKFLOW_KAFKA_PARTITIONS:-12}
      WORKFLOW_ASYNC_CONCURRENCY: ${WORKFLOW_ASYNC_CONCURRENCY:-4}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-6}
      LOG_FORMAT: ecs
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "8080:8080"
    networks: [ workflow-net ]

  dashboard:
    build:
      context: ./workflow-orchestrator-dashboard
      dockerfile: Dockerfile
      args:
        VITE_KIBANA_URL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
    container_name: workflow-dashboard
    profiles: [ dev, prod ]
    restart: unless-stopped
    depends_on:
      workflow-management-service:
        condition: service_healthy
    ports:
      - "5173:80"
    networks: [ workflow-net ]

  # External API mocks are needed by the example workflow only in PROD.
  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: workflow-wiremock
    profiles: [ dev, prod ]
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms32m -Xmx128m -XX:ActiveProcessorCount=2"
    command: [ "--global-response-templating", "--max-request-journal-entries", "1000" ]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "8089:8080"
    networks: [ workflow-net ]

  elasticsearch:
    cpu_shares: 256
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: workflow-elasticsearch
    profiles: [ prod ]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-adminpassword}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms384m -Xmx384m -XX:ActiveProcessorCount=2}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5
          --user "elastic:$$ELASTIC_PASSWORD"
          'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s'
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"(green|yellow)"'
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s
    networks: [ workflow-net ]

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: workflow-es-setup
    profiles: [ prod ]
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [ workflow-net ]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-adminpassword}
    volumes:
      - ./observability:/observability:ro
    entrypoint: ["/bin/bash", "/observability/setup-elasticsearch.sh"]

  kibana:
    cpu_shares: 256
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: workflow-kibana
    profiles: [ prod ]
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-adminpassword}
      - XPACK_FLEET_ISOUTOFTHEBOXENABLED=false
      - NODE_OPTIONS=${KIBANA_NODE_OPTIONS:---max-old-space-size=512}
    depends_on:
      es-setup:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks: [ workflow-net ]

  kibana-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: workflow-kibana-init
    profiles: [ prod ]
    depends_on:
      kibana:
        condition: service_healthy
    networks: [ workflow-net ]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-adminpassword}
    volumes:
      - ./observability:/observability:ro
    entrypoint: ["/bin/bash", "/observability/setup-kibana.sh"]

  otel-collector:
    cpu_shares: 512
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: workflow-otel-collector
    profiles: [ prod ]
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-adminpassword}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      es-setup:
        condition: service_completed_successfully
    networks: [ workflow-net ]

volumes:
  postgres_data:
  kafka_data:
  elasticsearch_data:

networks:
  workflow-net:
    driver: bridge
