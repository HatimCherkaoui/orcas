services:
  postgres:
    image: postgres:18.6
    container_name: workflow-postgres
    profiles:
      - DEV
      - PROD
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orchestrator -d orchestrator" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - observability-net

  kafka:
    image: apache/kafka:4.3.1
    container_name: workflow-kafka
    profiles:
      - DEV
      - PROD
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - observability-net

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: workflow-wiremock
    profiles:
      - DEV
    restart: unless-stopped
    command: [ "--verbose" ]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "8089:8080"
    networks:
      - observability-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    profiles:
      - PROD
      - DEV
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=adminpassword
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -u elastic:adminpassword -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - observability-net

  # 1. Set kibana_system password BEFORE Kibana starts
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: es-setup
    profiles:
      - PROD
      - DEV
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - observability-net
    command: >
      bash -c "
        until curl -s -u elastic:adminpassword -X POST http://elasticsearch:9200/_security/user/kibana_system/_password -H 'Content-Type: application/json' -d '{\"password\":\"adminpassword\"}' | grep -q '{}'; do
          echo 'Waiting to set kibana_system password...'
          sleep 3
        done;
        echo 'Creating OTel Data Stream Template...'
        curl -s -u elastic:adminpassword -X PUT http://elasticsearch:9200/_index_template/otel_data_streams -H 'Content-Type: application/json' -d '{\"index_patterns\":[\"traces-*\",\"logs-*\",\"metrics-*\"],\"data_stream\":{}}'
        echo 'es-setup completed successfully.'
      "
  # 2. Kibana starts only after es-setup completes
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    profiles:
      - PROD
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=adminpassword
      - XPACK_FLEET_ISOUTOFTHEBOXENABLED=false
    depends_on:
      es-setup:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - observability-net

  # 3. Pre-configure Spaces and Data Views in Kibana
  kibana-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: kibana-init
    profiles:
      - PROD
    depends_on:
      kibana:
        condition: service_healthy
    networks:
      - observability-net
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        echo "--> 1. Creating Data Views in Default Space..."
        curl -s -X POST "http://kibana:5601/api/data_views/data_view" \
          -u elastic:adminpassword \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{
            "data_view": {
              "title": "traces-*,logs-*,metrics-*",
              "name": "orchestrator",
              "timeFieldName": "@timestamp"
            }
          }'

        echo "--> 2. Creating Custom Space: Spring Boot Example App..."
        curl -s -X POST "http://kibana:5601/api/spaces/space" \
          -u elastic:adminpassword \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{
            "id": "springboot-example-app",
            "name": "Spring Boot Example App",
            "description": "Observability space for OTLP traces, logs, and metrics",
            "color": "#00BFB3"
          }'

        echo "--> 3. Creating Data Views in custom Space..."
        curl -s -X POST "http://kibana:5601/s/springboot-example-app/api/data_views/data_view" \
          -u elastic:adminpassword \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d '{
            "data_view": {
              "title": "traces-*,logs-*,metrics-*",
              "name": "orchestrator",
              "timeFieldName": "@timestamp"
            }
          }'

        echo "--> Kibana auto-configuration completed!"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    profiles:
      - DEV
      - PROD
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - observability-net

  example-app:
    build:
      context: .
      dockerfile: example-app/Dockerfile
    container_name: workflow-example-app
    profiles:
      - DEV
      - PROD
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      wiremock:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: workflow-example-app
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator
      SPRING_DATASOURCE_USERNAME: orchestrator
      SPRING_DATASOURCE_PASSWORD: orchestrator
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: workflow-orchestrator
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      DEMO_PAYMENT_BASE_URL: http://wiremock:8080
      DEMO_NOTIFICATION_BASE_URL: http://wiremock:8080
      DEMO_INVENTORY_BASE_URL: http://wiremock:8080
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_FORMAT: ecs
    ports:
      - "8080:8080"
    networks:
      - observability-net

  dashboard:
    build:
      context: ./workflow-orchestrator-dashboard
      dockerfile: Dockerfile
    container_name: workflow-dashboard
    profiles:
      - DEV
      - PROD
    restart: unless-stopped
    depends_on:
      - example-app
    ports:
      - "5173:80"
    networks:
      - observability-net

volumes:
  postgres_data:
  kafka_data:

networks:
  observability-net:
    driver: bridge