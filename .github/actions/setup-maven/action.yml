name: Set up verified Maven 3.9.11
description: Pin the Maven runtime supported by the Central publishing plugin
runs:
  using: composite
  steps:
    - name: Install checksum-verified Maven
      shell: bash
      run: |
        directory="$RUNNER_TEMP/orcas-maven"
        mkdir -p "$directory"
        curl --fail --silent --show-error --location --retry 3 \
          https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz \
          --output "$directory/maven.tar.gz"
        echo 'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  '"$directory/maven.tar.gz" | sha512sum --check --strict
        tar -xzf "$directory/maven.tar.gz" -C "$directory"
        echo "$directory/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
